<h2>{{ title }}</h2>
<input [(ngModel)]="newProduct" placeholder="Nouveau produit">
<button (click)="addProduct()">Ajouter</button>
<ul><li *ngFor="let product of products"><app-product-item [name]="product" (delete)="removeProduct($event)" /></li></ul>
<p *ngIf="products.length === 0">Aucun produit disponible.</p>
